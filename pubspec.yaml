name: chat_pet_mvp
description: A local Flutter prototype where an 8-bit pet lives inside chat.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.15.2
  firebase_app_check: ^0.3.2+10
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  video_player: ^2.9.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^3.2.4
  json_serializable: ^6.7.1
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/pets/
